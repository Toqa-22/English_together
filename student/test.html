<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/animations.js"></script>
<style>
  .test-pic-wrap { text-align: center; }
  .test-pic-wrap img { max-width: 320px; width: 100%; border-radius: 16px; box-shadow: var(--shadow-lg); margin-bottom: 20px; }
  .test-word-options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 420px; margin: 0 auto; }
  .test-word-options .q-option { text-align: center; }
</style>
</head>
<body>
  <header class="student-header" style="border-radius:0 0 20px 20px; padding-bottom:16px;">
    <div class="header-top">
      <button class="icon-btn" onclick="location.href='dashboard.html'" title="Back">←</button>
      <div></div>
    </div>
  </header>

  <div class="reading-wrap">
    <div class="reading-steps">
      <div class="reading-step active" id="step-reading">① Reading</div>
      <div class="reading-step" id="step-listening">② Listening</div>
      <div class="reading-step" id="step-vocab">③ Vocabulary</div>
    </div>

    <div id="content-area">
      <div class="loading-state"><div class="spinner"></div><p>Loading test...</p></div>
    </div>
  </div>

<script src="../js/student/test.js"></script>
</body>
</html>
