<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Score — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/animations.js"></script>
</head>
<body>
  <header class="student-header" style="border-radius:0 0 20px 20px; padding-bottom:16px;">
    <div class="header-top"><div></div><div></div></div>
  </header>

  <div class="reading-wrap">
    <div class="reading-steps">
      <div class="reading-step done">① Read</div>
      <div class="reading-step done">② Answer</div>
      <div class="reading-step active">③ Score</div>
    </div>

    <div id="result-area" class="result-wrap">
      <div class="loading-state"><div class="spinner"></div><p>Calculating your score...</p></div>
    </div>
  </div>

<script src="../js/student/result.js"></script>
</body>
</html>
