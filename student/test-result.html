<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Score — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/animations.js"></script>
<style>
  .test-section-scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
  .test-section-scores .tsb { background: #fff; border-radius: 12px; box-shadow: var(--shadow); padding: 12px 8px; text-align: center; }
  .test-section-scores .tsb .num { font-weight: 800; font-size: 16px; }
  .test-section-scores .tsb .label { font-size: 11px; color: #8892a8; }
</style>
</head>
<body>
  <header class="student-header" style="border-radius:0 0 20px 20px; padding-bottom:16px;">
    <div class="header-top"><div></div><div></div></div>
  </header>

  <div class="reading-wrap">
    <div id="result-area" class="result-wrap">
      <div class="loading-state"><div class="spinner"></div><p>Calculating your score...</p></div>
    </div>
  </div>

<script src="../js/student/test-result.js"></script>
</body>
</html>
