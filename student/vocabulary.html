<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Vocabulary — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/animations.js"></script>
<script src="../js/student/vocab-card.js"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav-inner">
      <a href="dashboard.html" class="top-nav-brand">📚 English Together</a>
      <div class="top-nav-links">
        <a href="dashboard.html">🏠 Home</a>
        <a href="stories.html">📚 Stories</a>
        <a href="vocabulary.html" class="active">📖 Vocabulary</a>
        <a href="listening.html">🎧 Listening</a>
        <a href="progress.html">📊 Progress</a>
        <a href="minigames.html">🎮 Games</a>
        <a href="leaderboard.html">🥇 Leaderboard</a>
        <a href="achievements.html">🏆 Badges</a>
        <a href="profile.html">👤 Profile</a>
      </div>
    </div>
  </nav>
  <div class="page-header">
    <h1>📚 My Vocabulary</h1>
    <button class="icon-btn" style="background:#eef0fa; color:var(--s-primary);" onclick="location.href='dashboard.html'">🏠</button>
  </div>

  <section class="section">
    <div id="vocab-stats" class="vocab-stats-grid">
      <div class="loading-state"><div class="spinner"></div></div>
    </div>

    <div id="weekly-goal-section" style="display:none; margin-bottom:16px;">
      <div class="card weekly-goal-card">
        <div class="wg-row">
          <span style="font-weight:700;">📚 Weekly Vocabulary Goal</span>
          <span class="wg-count" id="wg-count">0 / 0</span>
        </div>
        <div class="progress-bar-track"><div class="progress-bar-fill" id="wg-fill" style="width:0%"></div></div>
        <p id="wg-remaining" style="font-size:12px; color:#8892a8; margin:8px 0 0;"></p>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; align-items:center;">
      <button class="btn btn-primary" onclick="location.href='vocabulary-practice.html'">🧠 Practice Now →</button>
      <a href="vocabulary-history.html" class="btn btn-secondary">📊 History</a>
      <input type="text" id="search-input" placeholder="🔍 Search vocabulary..." style="flex:1; min-width:180px; padding:10px 14px; border-radius:10px; border:2px solid #e5e8f5;">
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="all">All</button>
      <button class="tab-btn" data-tab="NEW">🆕 New</button>
      <button class="tab-btn" data-tab="LEARNING">📖 Learning</button>
      <button class="tab-btn" data-tab="KNOWN">✓ Known</button>
      <button class="tab-btn" data-tab="NEEDS_REVIEW">🔄 Needs Review</button>
    </div>
    <div id="vocab-area" class="vocab-grid">
      <div class="loading-state"><div class="spinner"></div></div>
    </div>
  </section>

  <nav class="bottom-nav">
    <a href="dashboard.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="stories.html"><span class="nav-icon">📚</span>Stories</a>
    <a href="progress.html"><span class="nav-icon">📊</span>Progress</a>
    <a href="minigames.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="vocabulary.html" class="active"><span class="nav-icon">📖</span>Words</a>
    <a href="achievements.html"><span class="nav-icon">🏆</span>Badges</a>
    <a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
  </nav>

<script src="../js/student/vocabulary.js"></script>
</body>
</html>
