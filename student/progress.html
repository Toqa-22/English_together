<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Progress — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/animations.js"></script>
<script src="../js/student/shared.js"></script>
</head>
<body>
  <nav class="top-nav">
    <div class="top-nav-inner">
      <a href="dashboard.html" class="top-nav-brand">📚 English Together</a>
      <div class="top-nav-links">
        <a href="dashboard.html">🏠 Home</a>
        <a href="stories.html">📚 Stories</a>
        <a href="vocabulary.html">📖 Vocabulary</a>
        <a href="listening.html">🎧 Listening</a>
        <a href="progress.html" class="active">📊 Progress</a>
        <a href="minigames.html">🎮 Games</a>
        <a href="leaderboard.html">🥇 Leaderboard</a>
        <a href="achievements.html">🏆 Badges</a>
        <a href="profile.html">👤 Profile</a>
      </div>
    </div>
  </nav>
  <div class="page-header">
    <h1>📊 My Progress</h1>
    <button class="icon-btn" style="background:#eef0fa; color:var(--s-primary);" onclick="location.href='dashboard.html'">🏠</button>
  </div>

  <section class="section">
    <div id="progress-summary" class="stats-row" style="margin-top:16px;">
      <div class="loading-state"><div class="spinner"></div></div>
    </div>
  </section>

  <section class="section">
    <div class="card">
      <p style="font-weight:700; margin:0;">🔥 This Week</p>
      <div id="week-cal" class="week-cal"></div>
    </div>
  </section>

  <section class="section">
    <div class="card">
      <p style="font-weight:700; margin:0 0 8px;">Overall completion</p>
      <div class="progress-bar-track"><div class="progress-bar-fill anim-fill" id="overall-fill" style="width:0%"></div></div>
      <p style="font-size:13px; color:#8892a8; margin:8px 0 0;" id="overall-label">0 of 0 stories completed</p>
    </div>
  </section>

  <section class="section">
    <h2 class="section-title">Story History</h2>
    <div class="card" style="padding:0; overflow-x:auto;">
      <table class="history-table">
        <thead><tr><th>Story</th><th>Score</th><th>Date</th><th>Status</th></tr></thead>
        <tbody id="history-body">
          <tr><td colspan="4"><div class="loading-state"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <nav class="bottom-nav">
    <a href="dashboard.html"><span class="nav-icon">🏠</span>Home</a>
    <a href="stories.html"><span class="nav-icon">📚</span>Stories</a>
    <a href="progress.html" class="active"><span class="nav-icon">📊</span>Progress</a>
    <a href="minigames.html"><span class="nav-icon">🎮</span>Games</a>
    <a href="vocabulary.html"><span class="nav-icon">📖</span>Words</a>
    <a href="achievements.html"><span class="nav-icon">🏆</span>Badges</a>
    <a href="profile.html"><span class="nav-icon">👤</span>Profile</a>
  </nav>

<script src="../js/student/progress.js"></script>
</body>
</html>
