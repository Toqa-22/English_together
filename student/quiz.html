<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz — English Together</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/student.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/sound.js"></script>
<script src="../js/student/shared.js"></script>
</head>
<body>
  <header class="student-header" style="border-radius:0 0 20px 20px; padding-bottom:16px;">
    <div class="header-top">
      <button class="icon-btn" id="btn-back" title="Back">←</button>
      <div></div>
    </div>
  </header>

  <div class="reading-wrap">
    <div class="reading-steps">
      <div class="reading-step done">① Read</div>
      <div class="reading-step active" id="step-answer">② Answer</div>
      <div class="reading-step">③ Score</div>
    </div>

    <div class="quiz-progress-bar"><div class="quiz-progress-fill anim-fill" id="progress-fill" style="width:0%"></div></div>

    <div class="card story-reference" id="story-reference" style="display:none;">
      <button type="button" class="story-reference-toggle" id="btn-toggle-story">
        <span>📖 <span id="story-reference-title">Story Text</span></span>
        <span id="toggle-icon">▲</span>
      </button>
      <div class="story-reference-body" id="story-reference-body"></div>
    </div>

    <div id="quiz-area">
      <div class="loading-state"><div class="spinner"></div><p>Loading questions...</p></div>
    </div>

    <div class="quiz-warning" id="quiz-warning"></div>

    <div style="display:flex; justify-content:center; margin-top:12px;">
      <button class="btn btn-primary btn-large" id="btn-submit">Submit Answers</button>
    </div>
  </div>

<script src="../js/student/quiz.js"></script>
</body>
</html>
