<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignments — Admin</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
</head>
<body class="admin">
  <aside class="admin-sidebar" id="sidebar">
    <div class="brand">📚 English Together</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="students.html">👨‍🎓 Students</a>
    <a href="groups.html">👥 Groups</a>
    <a href="stories.html">📚 Stories</a>
    <a href="listening.html">🎧 Listening</a>
    <a href="vocabulary.html">📖 Vocabulary</a>
    <a href="tests.html">📝 Tests</a>
    <a href="test-history.html">🗂️ Test History</a>
    <a href="import.html">📥 Import</a>
    <a href="assignments.html" class="active">🎯 Assignments</a>
    <a href="challenges.html">🎯 Challenges</a>
    <a href="badges.html">🏆 Badges</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="notifications.html">🔔 Notifications</a>
    <a href="analytics.html">📈 Analytics</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="#" class="logout-link" id="logout-link">🚪 Log Out</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <h1>🎯 Assign Content</h1>
      </div>
    </div>

    <div class="card" style="max-width:640px; margin-bottom:24px;">
      <div class="admin-field" style="margin-bottom:14px;">
        <label>Content Type</label>
        <select id="f-type">
          <option value="story">📚 Story</option>
          <option value="listening">🎧 Listening Activity</option>
        </select>
      </div>
      <div class="admin-field" style="margin-bottom:14px;">
        <label id="content-label">Story</label>
        <select id="f-story"></select>
      </div>
      <div class="admin-field" style="margin-bottom:14px;">
        <label>Groups</label>
        <div id="group-checkboxes" style="display:flex; flex-direction:column; gap:6px;"></div>
      </div>
      <div class="admin-field" style="margin-bottom:14px;">
        <label>Availability</label>
        <select id="f-availability">
          <option value="available">Available now</option>
          <option value="locked">Locked</option>
          <option value="scheduled">Scheduled</option>
        </select>
      </div>
      <div id="schedule-fields" style="display:none; gap:10px; margin-bottom:14px;">
        <div class="admin-field" style="flex:1;"><label>Start Date</label><input type="datetime-local" id="f-start"></div>
        <div class="admin-field" style="flex:1;"><label>End Date</label><input type="datetime-local" id="f-end"></div>
      </div>
      <button class="btn btn-primary" id="btn-save-assignment">Save Assignment</button>
      <p id="assign-status" style="font-size:12px; color:#8892a8; margin-top:8px;"></p>
    </div>

    <h2 class="section-title" style="font-size:16px;">Current Assignments</h2>
    <div class="tabs" style="margin-bottom:12px;">
      <button class="tab-btn active" data-view="story">📚 Story Assignments</button>
      <button class="tab-btn" data-view="listening">🎧 Listening Assignments</button>
    </div>
    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th id="table-content-header">Story</th><th>Group</th><th>Status</th><th>Window</th><th></th></tr></thead>
        <tbody id="assignments-body">
          <tr><td colspan="5"><div class="loading-state"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

<script src="../js/admin/assignments.js"></script>
</body>
</html>
