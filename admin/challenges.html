<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Challenges — Admin</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
</head>
<body class="admin">
  <aside class="admin-sidebar" id="sidebar">
    <div class="brand">📚 English Together</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="students.html">👨‍🎓 Students</a>
    <a href="groups.html">👥 Groups</a>
    <a href="stories.html">📚 Stories</a>
    <a href="listening.html">🎧 Listening</a>
    <a href="vocabulary.html">📖 Vocabulary</a>
    <a href="tests.html">📝 Tests</a>
    <a href="test-history.html">🗂️ Test History</a>
    <a href="import.html">📥 Import</a>
    <a href="assignments.html">🎯 Assignments</a>
    <a href="challenges.html" class="active">🎯 Challenges</a>
    <a href="badges.html">🏆 Badges</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="notifications.html">🔔 Notifications</a>
    <a href="analytics.html">📈 Analytics</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="#" class="logout-link" id="logout-link">🚪 Log Out</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <h1>Challenges</h1>
      </div>
      <button class="btn btn-primary" id="btn-add-challenge">+ Add Challenge</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table">
        <thead><tr><th>Title</th><th>Type</th><th>Target</th><th>Reward</th><th>Audience</th><th>Dates</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="challenges-body">
          <tr><td colspan="8"><div class="loading-state"><div class="spinner"></div></div></td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <div class="modal-overlay" id="challenge-modal" style="display:none;">
    <div class="modal-box">
      <h2 id="modal-title">+ Add Challenge</h2>
      <form id="challenge-form">
        <input type="hidden" id="f-id">
        <div class="admin-field" style="margin-bottom:12px;"><label>Title</label><input type="text" id="f-title" required></div>
        <div class="admin-field" style="margin-bottom:12px;"><label>Description</label><input type="text" id="f-desc"></div>
        <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
          <div class="admin-field" style="flex:1;">
            <label>Type</label>
            <select id="f-type">
              <option value="read_stories">Read Stories</option>
              <option value="perfect_score">Perfect Scores</option>
              <option value="vocabulary">Vocabulary Learned</option>
            </select>
          </div>
          <div class="admin-field" style="flex:1;"><label>Target</label><input type="number" id="f-target" min="1" value="1" required></div>
        </div>
        <div class="admin-field" style="margin-bottom:12px;"><label>Points Reward</label><input type="number" id="f-reward" min="1" value="20" required></div>
        <div class="admin-field" style="margin-bottom:12px;">
          <label>Assign To</label>
          <select id="f-audience">
            <option value="all">All Students</option>
            <option value="group">Specific Group</option>
          </select>
        </div>
        <div class="admin-field" id="group-field" style="display:none; margin-bottom:12px;">
          <label>Group</label>
          <select id="f-group"></select>
        </div>
        <div style="display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap;">
          <div class="admin-field" style="flex:1;"><label>Start Date</label><input type="date" id="f-start" required></div>
          <div class="admin-field" style="flex:1;"><label>End Date</label><input type="date" id="f-end"></div>
        </div>
        <label style="font-size:13px;"><input type="checkbox" id="f-active" checked style="width:auto; margin-right:6px;"> Active</label>
        <p id="challenge-status" style="font-size:12px; color:#8892a8; min-height:16px; margin-top:8px;"></p>
        <div style="display:flex; gap:10px; margin-top:8px; flex-wrap:wrap;">
          <button type="submit" class="btn btn-primary">Save Challenge</button>
          <button type="button" class="btn btn-secondary" id="btn-cancel-challenge">Cancel</button>
        </div>
      </form>
    </div>
  </div>

<script src="../js/admin/challenges.js"></script>
</body>
</html>
