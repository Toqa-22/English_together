<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Admin</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
</head>
<body class="admin">
  <aside class="admin-sidebar" id="sidebar">
    <div class="brand">📚 English Together</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="students.html">👨‍🎓 Students</a>
    <a href="groups.html">👥 Groups</a>
    <a href="stories.html">📚 Stories</a>
    <a href="listening.html">🎧 Listening</a>
    <a href="vocabulary.html">📖 Vocabulary</a>
    <a href="tests.html">📝 Tests</a>
    <a href="test-history.html">🗂️ Test History</a>
    <a href="import.html">📥 Import</a>
    <a href="assignments.html">🎯 Assignments</a>
    <a href="challenges.html">🎯 Challenges</a>
    <a href="badges.html">🏆 Badges</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="notifications.html">🔔 Notifications</a>
    <a href="analytics.html">📈 Analytics</a>
    <a href="settings.html" class="active">⚙️ Settings</a>
    <a href="#" class="logout-link" id="logout-link">🚪 Log Out</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <h1>Settings</h1>
      </div>
    </div>

    <div class="card" style="max-width:480px; margin-bottom:20px;">
      <p style="font-weight:700; margin:0 0 12px;">Account</p>
      <p style="font-size:14px; margin:0 0 4px;">Name: <strong id="acc-name"></strong></p>
      <p style="font-size:14px; margin:0 0 4px;">Username: <strong id="acc-username"></strong></p>
    </div>

    <div class="card" style="max-width:480px;">
      <p style="font-weight:700; margin:0 0 12px;">Change Password</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <input type="password" id="new-password" placeholder="New password (min 6 chars)" style="flex:1; min-width:200px; padding:10px 12px; border-radius:10px; border:2px solid #e5e8f5;">
        <button class="btn btn-primary" id="btn-change-password">Update</button>
      </div>
      <p id="password-status" style="font-size:12px; color:#8892a8; margin:8px 0 0;"></p>
    </div>
  </main>

<script src="../js/admin/settings.js"></script>
</body>
</html>
