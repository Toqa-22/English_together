<style>
  .q-editor-card { margin-bottom: 14px; }
  .q-editor-row { display: flex; gap: 10px; align-items: flex-start; }
  .q-editor-row .reorder-col { display: flex; flex-direction: column; gap: 2px; }
  .q-editor-row .reorder-col button { background: #F0F1F8; border: none; border-radius: 6px; width: 28px; height: 24px; font-size: 12px; }
  .q-field label { font-size: 12px; font-weight: 700; color: #8892a8; display: block; margin-bottom: 4px; }
  .q-field input, .q-field select { width: 100%; padding: 8px 10px; border-radius: 8px; border: 2px solid #e5e8f5; font-size: 14px; }
  .q-opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .correct-marker { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 8px; }

  @media (max-width: 560px) {
    .q-editor-row { flex-direction: column; }
    .q-editor-row .reorder-col { flex-direction: row; order: 2; align-self: flex-end; }
    .q-opts-grid { grid-template-columns: 1fr; }
  }
</style>
</head>

      <button class="btn btn-secondary" onclick="location.href='stories.html'">← Back to Stories</button>
    </div>

      <div class="loading-state"><div class="spinner"></div></div>
    </div>

    <button class="btn btn-primary" id="btn-add-question" style="margin-top:8px;">+ Add Question</button>

<script src="../js/admin/questions.js"></script>
