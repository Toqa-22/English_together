<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Editor — Admin</title>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/animations.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<style>
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 760px; }
  .form-grid .full { grid-column: 1 / -1; }
  .field label { font-size: 13px; font-weight: 700; display: block; margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border-radius: 10px; border: 2px solid #e5e8f5; font-size: 14px; font-family: inherit;
  }
  .field textarea { min-height: 160px; resize: vertical; }
  .img-preview { width: 100%; max-width: 220px; height: 120px; border-radius: 12px; object-fit: cover; background: #eef0fa; margin-top: 8px; }

  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body class="admin">
  <aside class="admin-sidebar" id="sidebar">
    <div class="brand">📚 English Together</div>
    <a href="dashboard.html">📊 Dashboard</a>
    <a href="students.html">👨‍🎓 Students</a>
    <a href="groups.html">👥 Groups</a>
    <a href="stories.html" class="active">📚 Stories</a>
    <a href="listening.html">🎧 Listening</a>
    <a href="vocabulary.html">📖 Vocabulary</a>
    <a href="tests.html">📝 Tests</a>
    <a href="test-history.html">🗂️ Test History</a>
    <a href="import.html">📥 Import</a>
    <a href="assignments.html">🎯 Assignments</a>
    <a href="challenges.html">🎯 Challenges</a>
    <a href="badges.html">🏆 Badges</a>
    <a href="leaderboard.html">🥇 Leaderboard</a>
    <a href="notifications.html">🔔 Notifications</a>
    <a href="analytics.html">📈 Analytics</a>
    <a href="settings.html">⚙️ Settings</a>
    <a href="#" class="logout-link" id="logout-link">🚪 Log Out</a>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div style="display:flex; align-items:center; gap:12px;">
        <button class="hamburger" id="hamburger">☰</button>
        <h1 id="page-title">Add Story</h1>
      </div>
      <button class="btn btn-secondary" onclick="location.href='stories.html'">← Back to Stories</button>
    </div>

    <form id="story-form" class="card" style="max-width:800px;">
      <div class="form-grid">
        <div class="field full">
          <label>Title</label>
          <input type="text" id="f-title" required>
        </div>
        <div class="field full">
          <label>Description</label>
          <input type="text" id="f-description" placeholder="One line summary shown to admins">
        </div>
        <div class="field full">
          <label>Story Text</label>
          <textarea id="f-content" required placeholder="Full story text students will read..."></textarea>
        </div>
        <div class="field full">
          <label>Groups <span style="color:#8892a8; font-weight:400;">(who this is assigned to)</span></label>
          <div id="group-checkboxes" style="display:flex; flex-direction:column; gap:6px; padding:10px 12px; border:2px solid #e5e8f5; border-radius:10px;"></div>
        </div>
        <div class="field">
          <label>Difficulty</label>
          <select id="f-difficulty">
            <option value="very_easy">Very Easy</option>
            <option value="easy">Easy</option>
            <option value="advanced">Advanced</option>
          </select>
        </div>
        <div class="field">
          <label>Estimated Minutes</label>
          <input type="number" id="f-minutes" min="1" value="5">
        </div>
        <div class="field">
          <label>Emoji</label>
          <input type="text" id="f-emoji" placeholder="📖" maxlength="4">
        </div>
        <div class="field">
          <label>Unlock Order (blank = free access)</label>
          <input type="number" id="f-unlock-order" min="1">
        </div>
        <div class="field full">
          <label><input type="checkbox" id="f-active" checked style="width:auto; margin-right:6px;"> Active (visible when assigned)</label>
        </div>
      </div>

      <div style="margin-top:20px; display:flex; gap:12px; flex-wrap:wrap;">
        <button type="submit" class="btn btn-primary" id="save-btn">Save Story</button>
        <span id="save-status" style="align-self:center; font-size:13px; color:#8892a8;"></span>
      </div>
    </form>
  </main>

<script src="../js/admin/story-editor.js"></script>
</body>
</html>
